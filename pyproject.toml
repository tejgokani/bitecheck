[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "bitecheck"
version = "0.1.0"
description = "Do your agent's tests actually bite? Execution-evidence verification for AI-written code: diff-scoped multi-language mutation testing, goalpost cross-checks, claim checking, and a feedback loop for Claude Code, Codex and Gemini."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE", "src/bitecheck/data/NOTICE-npm-high-impact.txt"]
requires-python = ">=3.11"
authors = [{ name = "Tej Gokani" }]
keywords = ["mutation-testing", "testing", "coding-agents", "claude-code", "codex", "gemini-cli", "code-review", "ai", "verification", "reward-hacking"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "Operating System :: POSIX",
  "Programming Language :: Python :: 3",
  "Topic :: Software Development :: Testing",
  "Topic :: Software Development :: Quality Assurance",
]
dependencies = []

[project.urls]
Homepage = "https://github.com/tejgokani/bitecheck"
Issues = "https://github.com/tejgokani/bitecheck/issues"

[project.scripts]
bitecheck = "bitecheck.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/bitecheck"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 140
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "B", "I", "UP"]
ignore = ["E701", "E731", "B023"]
